<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oushadhi POS — Connection unavailable</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7f5;
        color: #18372a;
        font: 18px/1.6 system-ui;
      }
      main {
        max-width: 520px;
        padding: 40px;
      }
      h1 {
        font-size: 30px;
      }
      kbd {
        background: #e0e9e2;
        padding: 3px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Unable to connect to Oushadhi POS</h1>
      <p>
        Check your internet connection, then select
        <strong>POS → Home / Reconnect</strong> or press <kbd>Ctrl+R</kbd>.
      </p>
      <p>
        This desktop app needs a connection to your POS server. If the server is
        temporarily unavailable, try again shortly.
      </p>
    </main>
  </body>
</html>
